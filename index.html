<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>קטלוג קורן</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&family=Heebo:wght@400;500;700&display=swap');

  :root {
    --koren-bg: #fbf6f0;
    --koren-surface: #ffffff;
    --koren-surface-2: #fff1e3;
    --koren-ink: #211711;
    --koren-ink-soft: #8a7969;
    --koren-orange: #f5803d;
    --koren-orange-bright: #ff9d5f;
    --koren-orange-deep: #c85f22;
    --koren-border: rgba(200,95,34,0.16);
    --koren-border-strong: rgba(200,95,34,0.32);
    --font-display: 'Rubik', 'Segoe UI', system-ui, sans-serif;
    --font-body: 'Heebo', 'Segoe UI', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--koren-bg);
    color: var(--koren-ink);
    direction: rtl;
    font-family: var(--font-body);
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }
  h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
  button { font-family: inherit; -webkit-tap-highlight-color: transparent; border: none; background: none; color: inherit; }
  input { font-family: inherit; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  .app { position: relative; flex: 1 1 auto; min-height: 0; isolation: isolate; }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; }
  .screen.is-active { display: flex; }

  /* ---------- top strip ---------- */
  .top-strip {
    display: flex; align-items: center; justify-content: space-between;
    padding: clamp(16px, 2.6vh, 26px) clamp(20px, 4vw, 48px) 0;
    padding-top: calc(env(safe-area-inset-top, 0px) + clamp(16px, 2.6vh, 26px));
  }
  .wordmark { display: flex; align-items: center; }
  .wordmark img { display: block; height: clamp(58px, 8vh, 88px); width: auto; border-radius: 10px; }

  /* ---------- HOME ---------- */
  #screen-home { padding-bottom: clamp(24px, 4vh, 40px); }
  .hero { padding: clamp(10px, 1.8vh, 20px) clamp(20px, 4vw, 48px) clamp(14px, 2vh, 22px); text-align: center; }
  .hero h1 { font-size: clamp(32px, 4.6vw, 52px); font-weight: 900; color: var(--koren-ink); }
  .hero h1 em { font-style: normal; color: var(--koren-orange); }

  .search-row { padding: 0 clamp(20px, 4vw, 48px) clamp(16px, 2.2vh, 22px); }
  .search-box {
    position: relative; display: flex; align-items: center; gap: 10px;
    background: var(--koren-surface); border: 1.5px solid var(--koren-border-strong);
    border-radius: 999px; padding: clamp(10px, 1.4vh, 15px) clamp(16px, 2vw, 22px);
    box-shadow: 0 2px 10px rgba(200,95,34,0.06);
  }
  .search-box svg { width: 22px; height: 22px; color: var(--koren-orange-deep); flex: none; }
  .search-box input { flex: 1 1 auto; border: none; outline: none; background: none; font-size: clamp(15px, 1.6vw, 18px); color: var(--koren-ink); }
  .search-box input::placeholder { color: var(--koren-ink-soft); }
  .search-clear { display: none; width: 30px; height: 30px; border-radius: 50%; background: var(--koren-surface-2); align-items: center; justify-content: center; flex: none; }
  .search-clear svg { width: 14px; height: 14px; color: var(--koren-ink-soft); }
  .search-box.has-text .search-clear { display: flex; }

  /* ---------- featured strip ---------- */
  .featured-wrap { padding: 0 0 clamp(18px, 2.4vh, 26px); }
  .featured-wrap.is-empty { display: none; }
  .featured-head { display: flex; align-items: center; gap: 8px; padding: 0 clamp(20px, 4vw, 48px) 12px; }
  .featured-head svg { width: 22px; height: 22px; color: var(--koren-orange); }
  .featured-head h2 { font-size: clamp(17px, 2vw, 22px); }
  .featured-scroll { display: flex; justify-content: center; gap: 10px; overflow-x: auto; padding: 2px clamp(20px, 4vw, 48px) 6px; scroll-snap-type: x proximity; }
  /* כרטיס-"מבצעים" קומפקטי ונפרד לגמרי מהכרטיס הרגיל (לא רק גרסה-מכווצת שלו) -
     בלי צ'יפים/צבעים/תגית-זמינות, מסגרת כתומה בולטת להבחנה ברורה מכרטיסי-הרשת. */
  .featured-scroll .card.featured-card {
    width: clamp(104px, 12vw, 130px); min-width: clamp(104px, 12vw, 130px); flex: none; scroll-snap-align: start;
    border: 2px solid var(--koren-orange); box-shadow: 0 5px 16px rgba(200,95,34,0.22);
  }
  .featured-card .card-media { aspect-ratio: 1/1; }
  .featured-card .card-media img { padding: 6px; }
  .featured-card .card-body { padding: 7px 8px 9px; gap: 4px; }
  .featured-card .card-title {
    font-size: 11.5px; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .featured-card .card-footer { padding-top: 0; }
  .featured-card .price { font-size: 13px; }
  .featured-card .discount-badge-corner { font-size: 9.5px; padding: 3px 6px; top: 5px; right: 5px; }

  .tiles { display: grid; gap: clamp(14px, 2vw, 26px); padding: 0 clamp(20px, 4vw, 48px) clamp(96px, 11vh, 120px); align-content: start; }
  @media (orientation: landscape) { .tiles { grid-template-columns: repeat(3, 1fr); } }
  @media (orientation: portrait)  { .tiles { grid-template-columns: repeat(2, 1fr); } }
  .tile {
    position: relative; border-radius: 24px; padding: clamp(9px, 1.4vh, 14px);
    aspect-ratio: 1.25 / 1; min-height: 128px;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px;
    text-align: center; cursor: pointer; color: #fff;
    background: linear-gradient(150deg, var(--koren-orange-bright), var(--koren-orange) 55%, var(--koren-orange-deep));
    box-shadow: 0 8px 22px rgba(200,95,34,0.28);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .tile:active { transform: scale(0.97); box-shadow: 0 4px 12px rgba(200,95,34,0.28); }
  .tile-photo {
    width: 100%; flex: 1 1 auto; min-height: 0; position: relative;
    background: #fdfbf8; border-radius: 15px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .tile-photo img { width: 86%; height: 86%; object-fit: contain; }
  .tile-icon-fallback {
    width: clamp(40px, 5.4vw, 62px); height: clamp(40px, 5.4vw, 62px); border-radius: 50%;
    background: var(--koren-orange); display: none; align-items: center; justify-content: center;
    color: #fff; flex: none;
  }
  .tile-icon-fallback svg { width: 56%; height: 56%; }
  .tile-photo[data-has-image="false"] img, .tile-photo.img-failed img { display: none; }
  .tile-photo[data-has-image="false"] .tile-icon-fallback, .tile-photo.img-failed .tile-icon-fallback { display: flex; }
  .tile-name { font-family: var(--font-display); font-weight: 900; font-size: clamp(13px, 1.4vw, 17px); line-height: 1.2; padding-top: 2px; }
  .tile-count { font-size: 12px; color: rgba(255,255,255,0.88); }

  /* results (search-on-home) */
  #home-results { padding: 0 clamp(20px, 4vw, 48px) clamp(96px, 11vh, 120px); display: none; }
  #home-results.is-active { display: block; }
  #home-results .result-label { color: var(--koren-ink-soft); font-size: 13px; padding-bottom: 10px; }

  /* ---------- CATEGORY ---------- */
  .cat-header {
    padding: calc(env(safe-area-inset-top, 0px) + clamp(14px, 2.2vh, 22px)) clamp(20px, 4vw, 48px) clamp(12px, 1.8vh, 18px);
    position: sticky; top: 0; background: var(--koren-bg); z-index: 2; border-bottom: 1px solid var(--koren-border);
    display: flex; flex-direction: column; gap: 12px;
  }
  .crumb { display: inline-flex; align-items: center; gap: 6px; color: var(--koren-ink-soft); font-size: 15px; align-self: flex-start; cursor: pointer; }
  .crumb svg { width: 18px; height: 18px; }
  .cat-header h2 { font-size: clamp(20px, 2.6vw, 30px); display: flex; align-items: center; gap: 12px; }
  .cat-header h2 .tile-icon { width: 34px; height: 34px; background: var(--koren-orange); color: #fff; }
  .cat-header h2 .tile-icon svg { width: 60%; height: 60%; }

  .cat-search .search-box { padding: 9px 16px; }
  .filter-row { display: flex; flex-wrap: wrap; gap: 16px 26px; }
  .filter-group { display: flex; flex-direction: column; gap: 6px; }
  .filter-group-label { font-size: 11.5px; font-weight: 700; color: var(--koren-ink-soft); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .filter-chip {
    font-size: 13px; padding: 7px 15px; border-radius: 999px; border: 1.5px solid var(--koren-border-strong);
    background: var(--koren-surface); color: var(--koren-ink-soft); cursor: pointer; white-space: nowrap;
  }
  .filter-chip.is-active { background: var(--koren-orange); border-color: var(--koren-orange); color: #fff; font-weight: 700; }

  /* ---------- SUBCATEGORY (mid-level, no photos) ---------- */
  .subcat-header {
    padding: calc(env(safe-area-inset-top, 0px) + clamp(18px, 2.6vh, 26px)) clamp(20px, 4vw, 48px) clamp(6px, 1vh, 10px);
  }
  .subcat-header h2 { font-size: clamp(22px, 2.8vw, 32px); display: flex; align-items: center; gap: 12px; }
  .subcat-header h2 .tile-icon { width: 34px; height: 34px; background: var(--koren-orange); color: #fff; }
  .subcat-header h2 .tile-icon svg { width: 60%; height: 60%; }
  .subcat-tiles {
    display: grid; gap: clamp(16px, 2.4vw, 30px); align-content: start;
    padding: clamp(18px, 2.6vh, 30px) clamp(20px, 4vw, 48px) clamp(96px, 11vh, 120px);
  }
  @media (orientation: landscape) { .subcat-tiles { grid-template-columns: repeat(2, 1fr); } }
  @media (orientation: portrait)  { .subcat-tiles { grid-template-columns: repeat(1, 1fr); } }
  .subcat-tile {
    position: relative; border-radius: 26px; padding: clamp(26px, 4.4vh, 46px) clamp(22px, 3.4vw, 36px);
    min-height: clamp(120px, 16vh, 190px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    text-align: center; cursor: pointer; color: #fff;
    background: linear-gradient(150deg, var(--koren-orange-bright), var(--koren-orange) 55%, var(--koren-orange-deep));
    box-shadow: 0 8px 22px rgba(200,95,34,0.28);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .subcat-tile:active { transform: scale(0.97); box-shadow: 0 4px 12px rgba(200,95,34,0.28); }
  .subcat-tile-name { font-family: var(--font-display); font-weight: 900; font-size: clamp(20px, 2.6vw, 32px); line-height: 1.25; }
  .subcat-tile-count { font-size: 13px; color: rgba(255,255,255,0.88); }

  .crumb-row { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; align-self: flex-start; }
  .crumb-sep { color: var(--koren-ink-soft); font-size: 14px; }

  .product-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); align-content: start;
    gap: clamp(14px, 1.8vw, 22px); padding: clamp(16px, 2.5vh, 26px) clamp(20px, 4vw, 48px) clamp(96px, 11vh, 120px);
  }

  .card {
    background: var(--koren-surface); border: 1px solid var(--koren-border); border-radius: 18px; overflow: hidden;
    cursor: pointer; display: flex; flex-direction: column; text-align: right; min-width: 0;
    box-shadow: 0 3px 12px rgba(33,23,17,0.06); transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card:active { transform: scale(0.97); box-shadow: 0 2px 6px rgba(33,23,17,0.08); }

  .card-media, .sheet-media {
    position: relative; overflow: hidden;
  }
  .card-media { aspect-ratio: 4/3; background: #ffffff; border-bottom: 1px solid var(--koren-border); }
  .sheet-media {
    aspect-ratio: 1/1; border-radius: 22px; border: 1px solid var(--koren-border);
    background: #ffffff;
    flex: 0 0 clamp(210px, 30vw, 340px);
  }
  @media (max-width: 640px) { .sheet-media { flex-basis: min(260px, 62vw); } }
  .card-media img, .sheet-media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .card-media img { padding: 10px; }
  .sheet-media img { padding: 14px; }

  .gallery-nav {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
    width: 38px; height: 38px; border-radius: 50%;
    background: rgba(255,255,255,0.94); border: 1.5px solid var(--koren-border-strong);
    color: var(--koren-ink); display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 3px 10px rgba(33,23,17,0.15);
  }
  .gallery-nav svg { width: 20px; height: 20px; }
  .gallery-nav.gallery-prev { left: 10px; }
  .gallery-nav.gallery-next { right: 10px; }
  .gallery-dots { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 2; display: flex; gap: 6px; }
  .gallery-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(200,95,34,0.3); cursor: pointer; }
  .gallery-dot.is-active { background: var(--koren-orange); }
  .media-fallback {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--koren-orange-deep);
    background:
      repeating-linear-gradient(135deg, rgba(200,95,34,0.07) 0 2px, transparent 2px 14px),
      var(--koren-surface-2);
  }
  .card-media[data-has-image="true"] .media-fallback,
  .sheet-media[data-has-image="true"] .media-fallback { display: none; }
  .card-media.img-failed img, .sheet-media.img-failed img { display: none; }
  .card-media.img-failed .media-fallback, .sheet-media.img-failed .media-fallback { display: flex; }
  .card-media .media-fallback svg { width: 30%; height: 30%; opacity: 0.6; }
  .sheet-media .media-fallback svg { width: 22%; height: 22%; opacity: 0.55; }

  .discount-badge-corner {
    position: absolute; top: 8px; right: 8px;
    background: var(--koren-orange-deep); color: #fff; font-size: 11px; font-weight: 800;
    padding: 4px 9px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }

  .card-body { padding: clamp(12px, 1.6vw, 18px); display: flex; flex-direction: column; gap: 8px; flex: 1 1 auto; }
  .card-title { font-family: var(--font-display); font-weight: 700; font-size: clamp(14px, 1.5vw, 17px); line-height: 1.25; }
  .card-attrs { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: clamp(10px, 1vw, 12px); color: var(--koren-ink-soft); background: var(--koren-surface-2); border: 1px solid var(--koren-border); border-radius: 999px; padding: 4px 10px; }

  .card-colors { display: flex; align-items: center; gap: 5px; }
  .card-color-dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--koren-border-strong); flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5); }
  .card-color-more { font-size: 10.5px; color: var(--koren-ink-soft); font-weight: 700; }

  .card-footer { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; padding-top: 6px; gap: 8px; }
  .price-block { display: flex; flex-direction: column; }
  .price-compare { font-size: 12px; color: var(--koren-ink-soft); text-decoration: line-through; }
  .price { font-family: var(--font-display); font-weight: 900; color: var(--koren-orange-deep); font-size: clamp(16px, 1.9vw, 22px); font-variant-numeric: tabular-nums; }
  .avail { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: #fff; background: var(--koren-orange); border-radius: 999px; padding: 3px 9px; font-weight: 700; white-space: nowrap; }

  .empty-state { margin: auto; text-align: center; color: var(--koren-ink-soft); padding: 40px; font-size: 15px; }

  /* ---------- PRODUCT OVERLAY ---------- */
  #overlay { position: fixed; inset: 0; z-index: 30; display: none; background: rgba(33,23,17,0.55); backdrop-filter: blur(3px); align-items: center; justify-content: center; padding: clamp(10px, 2vh, 26px); }
  #overlay.is-active { display: flex; }

  .sheet { width: min(1280px, 96vw); max-height: min(92vh, 100%); background: var(--koren-surface); border-radius: 28px; overflow-y: auto; }

  .sheet-close-bar { position: sticky; top: 0; z-index: 3; display: flex; justify-content: flex-end; padding: 14px 14px 0; pointer-events: none; }
  .sheet-close { pointer-events: auto; width: 40px; height: 40px; border-radius: 50%; background: var(--koren-surface); border: 1.5px solid var(--koren-border-strong); color: var(--koren-ink); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 3px 10px rgba(33,23,17,0.12); }
  .sheet-close svg { width: 18px; height: 18px; }

  .sheet-top { display: flex; align-items: flex-start; gap: clamp(20px, 3vw, 40px); padding: clamp(4px, 1vh, 10px) clamp(22px, 4vw, 38px) 0; }
  @media (max-width: 640px) { .sheet-top { flex-direction: column; align-items: center; text-align: center; } }

  .sheet-info { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; padding-top: 8px; }
  @media (max-width: 640px) { .sheet-info { align-items: center; } }
  .sheet-cat-chip { display: inline-block; align-self: flex-start; font-size: 12px; color: var(--koren-orange-deep); background: var(--koren-surface-2); border: 1px solid var(--koren-border); border-radius: 999px; padding: 4px 12px; margin-bottom: 10px; font-weight: 700; }
  @media (max-width: 640px) { .sheet-cat-chip { align-self: center; } }
  .sheet-title { font-size: clamp(21px, 2.8vw, 30px); line-height: 1.25; }
  .sheet-model-code { font-size: 13px; color: var(--koren-ink-soft); margin-top: 4px; }

  .sheet-info-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  @media (max-width: 640px) { .sheet-info-chips { justify-content: center; } }

  .sheet-color-section { margin-top: 18px; }
  @media (max-width: 640px) { .sheet-color-section { align-self: stretch; text-align: center; } }
  .sheet-color-label { font-size: 12.5px; font-weight: 700; color: var(--koren-ink-soft); margin-bottom: 8px; }
  .sheet-color-label b { color: var(--koren-ink); font-weight: 800; }
  .sheet-color-swatches { display: flex; flex-wrap: wrap; gap: 10px; }
  @media (max-width: 640px) { .sheet-color-swatches { justify-content: center; } }
  .sheet-color-swatch {
    width: 34px; height: 34px; border-radius: 50%; cursor: pointer; flex: none;
    border: 2px solid var(--koren-surface); box-shadow: 0 0 0 1.5px var(--koren-border-strong), inset 0 0 0 1px rgba(255,255,255,0.4);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .sheet-color-swatch:active { transform: scale(0.92); }
  .sheet-color-swatch.is-active { box-shadow: 0 0 0 1.5px var(--koren-surface), 0 0 0 4px var(--koren-orange); }

  .sheet-price-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 18px; padding: 14px 18px; background: var(--koren-surface-2); border-radius: 16px; width: fit-content; }
  .sheet-price-stack { display: flex; align-items: baseline; gap: 10px; }
  .sheet-price { font-family: var(--font-display); font-weight: 900; color: var(--koren-orange-deep); font-size: clamp(28px, 4vw, 40px); font-variant-numeric: tabular-nums; }
  .sheet-price-compare { font-size: 15px; color: var(--koren-ink-soft); text-decoration: line-through; }
  .sheet-discount-badge { font-size: 12px; font-weight: 800; color: #fff; background: var(--koren-orange-deep); border-radius: 999px; padding: 5px 13px; }

  .sheet-details { padding: clamp(24px, 3.4vh, 34px) clamp(22px, 4vw, 38px) 12px; margin-top: clamp(18px, 2.6vh, 28px); border-top: 1px solid var(--koren-border); }
  .sheet-details h4 { font-family: var(--font-display); font-size: 16px; color: var(--koren-orange-deep); margin: 20px 0 8px; }

  /* ---------- HOME FAB ---------- */
  .home-fab {
    position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); left: calc(env(safe-area-inset-left, 0px) + 22px);
    width: clamp(56px, 6vw, 68px); height: clamp(56px, 6vw, 68px); border-radius: 50%;
    background: linear-gradient(150deg, var(--koren-orange-bright), var(--koren-orange-deep)); color: #fff;
    display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 40;
    box-shadow: 0 8px 22px rgba(200,95,34,0.4);
  }
  .home-fab.is-hidden { display: none; }
  .home-fab svg { width: 46%; height: 46%; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="app">

  <!-- ===================== HOME ===================== -->

<script>
(function () {
  "use strict";

  /* ============================================================
   * שכבת-נתונים — מוזרקת בזמן-build ע"י kiosk-admin\build.ps1
   * ============================================================
   * KIOSK_DATA מגיע ממערכת-הניהול (kiosk-admin) - products.json +
   * categories.json - ולא ממערכים סטטיים בקוד יותר. תמונות (גם
   * מוצרים וגם קטגוריות) הן תמיד קבצים נפרדים (images/<modelCode>/N.png,
   * categories/<categoryId>.png) שנקבעים בזמן-build לפי סקירה של
   * תיקיות-התמונות בפרויקט - לעולם לא מוטמעות/נכתבות כאן ידנית.
   *
   * סכימת-פריט ("הפרמטרים הנכונים להתאמה"):
   *   sku            (חובה, ייחודי) — מק"ט מדויק.
   *   category       (חובה) — אחד ממזהי-הקטגוריה ב-CATEGORIES בלבד.
   *   subCategory    (רשות) — אחד ממזהי-תת-הקטגוריה של אותה קטגוריה,
   *                  אם יש לה CATEGORIES[].subCategories. בלי זה, מוצר
   *                  בקטגוריה-עם-תתי-קטגוריות לא יופיע בשום רשת-מוצרים.
   *   title          (חובה) — כותרת שיווקית, כפי שתוטמע בדיוק (גם
   *                  בכרטיס וגם ככותרת-ראשית בחלון-הצף).
   *   modelCode      (רשות) — קוד-הדגם המדויק. מוצג רק בחלון-הצף, מתחת
   *                  לכותרת, בגופן קטן-יותר. גם שם-התיקייה-המתאימה
   *                  בתיקיית "קיוסק תצוגת מוצרים\תמונות למוצרים לפי
   *                  קוד דגם\<modelCode>\".
   *   price          (חובה כדי שהמוצר יוצג — בלי מחיר, מוסתר).
   *   compareAtPrice (רשות) — "מחיר קודם"/מחיר-מדף להשוואה. כשקיים
   *                  וגדול מ-price, מוצג קו-חוצה + תג-אחוז-הנחה.
   *   brand          (רשות) — מותג. מוצג כ-chip גם בכרטיס וגם בחלון-הצף.
   *   supplier       (רשות) — ספק/יבואן (אותו שדה-נתונים אחד). מוצג
   *                  כ-chip "ספק: X" בכרטיס, ו-"יבואן: X" בחלון-הצף.
   *   warranty       (רשות) — תקופת אחריות, טקסט חופשי. מוצג כ-chip
   *                  גם בכרטיס וגם בחלון-הצף.
   *   details        (רשות) — HTML מוכן-מראש (לא-escaped), נבנה
   *                  ע"י build.ps1 ממערך-בלוקים-מבני-ב-products.json
   *                  (עורכים אותם רק דרך מערכת-הניהול, לא ידנית).
   *   images         (רשות) — מערך קישורי-תמונה יחסיים, לפי הסדר
   *                  שהם יוצגו בגלריה - נגזר-אוטומטית בזמן-build
   *                  מתיקיית-המוצר, לא נערך ישירות כאן.
   *   featured       (רשות, ברירת-מחדל false) — מוצג ברצועת "המבצעים
   *                  החמים" בעמוד הבית.
   *   colors         (רשות) — וריאנטים-של-צבע לאותו מוצר בדיוק (כל שאר

ת ממלאת אוטומטית את מיכל המים של הרובוט במהלך הניקוי כאשר מפלס המים נמוך היא יכולה לנגב עד 330 מ”ר לפני שתצטרכו למלא את מיכל המים הנקי באופן ידני\u003c/p\u003e\u003ch4\u003eבסיס תחנת העגינה הניתן לניתוק לשטיפה קלה של הצטברות לכלוך\u003c/h4\u003e\u003cp\u003eניתן להסיר את בסיס תחנת העגינה ולנקותו באופן יסודי על מנת להפחית הצטברות בוץ ולכלוך לאורך זמן להפחתת סתימות עוצב ושודרג המסנן לגודל גדול יותר\u003c/p\u003e\u003ch4\u003eמילוי אוטומטי של מיכל המים\u003c/h4\u003e\u003cp\u003eממלא את מיכל המים באופן אוטומטי בעת הצורך\u003c/p\u003e\u003ch4\u003eעוזר קולי חכם מובנה אמור “שלום רוקי” לקבלת עזרה\u003c/h4\u003e\u003cp\u003eפשוט אמור “שלום רוקי” כדי להתחיל בניקוי להתאים הגדרות לתרחישים שונים או לכוון את הרובוט למקום שבו הוא נחוץ, והכל ללא מגע יד להנות מהנוחות של שליטה קולית ללא צורך ב-WiFi או בטלפון אפילו כשלא מחוברים לאינטרנט\u003c/p\u003e\u003ch4\u003eזיהוי מכשולים באמצעות בינה מלאכותית ריאקטיבית נווט בכל שטח ביתי\u003c/h4\u003e\u003cp\u003eמצויד באור מובנה ובמצלמת RGB, הרובוט מזהה ונמנע מ-62 סוגי עצמים ב-20 קטגוריות הוא מנווט ביעילות סביב מכשולים ומפחית את הצורך בהתערבות ידנית הן בסביבות מוארות והן בסביבות חשוכות\u003c/p\u003e\u003ch4\u003eניווט PreciSense LiDAR\u003c/h4\u003e\u003cp\u003eניווט מבוסס LiDAR יוצר מפות מפורטות ומדויקות בזמן אמת כדי למצוא את המסלול האופטימלי לניקוי הבית ידידותי לחיות מחמד\u003c/p\u003e\u003ch4\u003eניקוי שקט\u003c/h4\u003e\u003cp\u003eה-Roborock Qrevo Edge מצויד במנועים ללא מברשות ובעיצוב חומרה מתקדם שממזער רעש במהלך הפעולה עם רמות רעש של שטיפה נמוכות עד 55dB, הוא מספק חוויית ניקוי שקטה במיוחד שומר על חיות המחמד רגועות ולא מופרעות\u003c/p\u003e\u003ch4\u003eזיהוי אוטומטי של חיות מחמד\u003c/h4\u003e\u003cp\u003eכאשר מתקרבים לגורים או כלבלבים, הרובוט יעצור מיד את המברשת הראשית שלו ויזוז הצידה מראש כדי למנוע הפחדה של חיות המחמד האהובות\u003c/p\u003e\u003ch4\u003eצילום חיות המחמד\u003c/h4\u003e\u003cp\u003eהרובוט יכול לצלם תמונות מקסימות של חבריכם הפרוותיים במהלך הניקיונות והתמונות זמינות להורדה\u003c/p\u003e\u003ch4\u003eחיפוש אחר חיית המחמד\u003c/h4\u003e\u003cp\u003eהרובוט יכול לחפש באופן אוטומטי אחר חיות מחמד, ולמצוא היכן הן מסתתרות בנוסף, ניתן לבדוק את מיקום ומצב חיית המחמד כאשר נמצאים מחוץ לבית\u003c/p\u003e\u003ch4\u003eטכנולוגיית Roborock SmartPlan\u003c/h4\u003e\u003cp\u003eמצבי ניקוי מותאמים להרגלים , סוגי החדרים וחומרי הרצפה טכנולוגיית Roborock SmartPlan מייצרת באופן חכם מצבי ניקוי ומכווננת הגדרות והעדפות באופן אוטומטית להנות מניקוי ללא דאגות וללא צורך בהתאמות ידניות של מצבים\u003c/p\u003e\u003ch4\u003eתצוגת התקדמות ניקוי בזמן אמת\u003c/h4\u003e\u003cp\u003eהשתמשו בסרגל ההתקדמות הדינמי של האפליקציה כדי לעקוב בקלות אחר מצב הניקוי של הרובוט לקבל עדכונים בזמן אמת ישירות בעמוד הבית, לשיפור היעילות וחיסכון בזמן\u003c/p\u003e\u003ch4\u003eשליטה קולית של צד שלישי\u003c/h4\u003e\u003cp\u003eפקודות קוליות באמצעות Amazon Alexa, Apple Siri Shortcuts או Google Home\u003c/p\u003e\u003ch4\u003eמפרט טכני\u003c/h4\u003e\u003cp\u003eעוצמת שאיבה 18500Pa עוצמת רעש 55db\u003c/p\u003e\u003ch4\u003eמשקל\u003c/h4\u003e\u003cp\u003eשואב רובוטי 3.90 ק\"ג תחנת עגינה 12.60 ק\"ג כח 66W נפח מיכל אבק 325 מ\"ל נפח מיכל מים 72 מ\"ל זמן טעינה כ4 שעות\u003c/p\u003e\u003ch4\u003eצבעים בכפוף למלאי\u003c/h4\u003e\u003cp\u003eשחור 6936905900548 לבן 6936905900555\u003c/p\u003e"}]};

    blenders: iconBlender, kettles: iconKettle, toasters: iconToaster, panini: iconPanini,
    mixers: iconMixer, hairBeauty: iconHairBeauty, grooming: iconGrooming, microwaves: iconMicrowave,
    toasterOven: iconToasterOven, coffeeWorld: iconCoffee, fans: iconFan, irons: iconIron,
    vacuums: iconVacuum, mopVacuums: iconMopVacuum, cooktops: iconCooktop, juicers: iconJuicer,
    iceMakers: iconIceMaker, other: iconOther
  };

  var CATEGORIES = (KIOSK_DATA.categories || []).map(function (c) {
    return {
      id: c.id,
      label: c.label,
      icon: ICONS_BY_ID[c.id] || iconOther,
      subCategories: c.subCategories || null,
      image: c.image || null
    };
  });
  var PRODUCTS = KIOSK_DATA.products || [];

  function getCategories() { return CATEGORIES; }
  function getProducts() { return PRODUCTS; }

  /* ---------------- helpers ---------------- */
  function fmtPrice(n) { return "₪" + Math.round(n).toLocaleString("he-IL"); }
  function catByPid(id) { var cs = getCategories(); for (var i = 0; i < cs.length; i++) { if (cs[i].id === id) return cs[i]; } return null; }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]; }); }
  function escapeAttr(s) { return escapeHtml(s); }
  function discountPct(p) { return Math.round((1 - p.price / p.compareAtPrice) * 100); }
  function inStock(p) { return !!p.price; }

  window.handleMediaError = function (el) {
    var wrap = el.closest(".card-media, .sheet-media, .tile-photo");
    if (wrap) wrap.classList.add("img-failed");
  };

  function productImages(p) {
    if (p.images && p.images.length) return p.images;
    if (p.image) return [p.image];
    return [];
  }

  function productColors(p) {
    return (p.colors && p.colors.length) ? p.colors : [];
  }

  function cardColorDotsHtml(p) {
    var colors = productColors(p);
    if (!colors.length) return "";
    var maxDots = 5;
    var shown = colors.slice(0, maxDots);
    var dots = shown.map(function (c) {
      return '<span class="card-color-dot" style="background:' + escapeAttr(c.swatch || "#cccccc") + '" title="' + escapeAttr(c.name || "") + '"></span>';
    }).join("");
    var more = colors.length > maxDots ? '<span class="card-color-more">+' + (colors.length - maxDots) + '</span>' : "";
    return '<span class="card-colors">' + dots + more + '</span>';
  }

  function mediaMarkup(imgSrc) {
    if (imgSrc) {
      return '<img src="' + escapeAttr(imgSrc) + '" alt="" loading="lazy" onerror="handleMediaError(this)"><span class="media-fallback">' + placeholderIcon + '</span>';
    }
    return '<span class="media-fallback">' + placeholderIcon + '</span>';
  }

  function galleryHtml(images) {
    if (!images.length) return mediaMarkup(null);
    var imgTag = '<img src="' + escapeAttr(images[0]) + '" alt="" data-gallery-img onerror="handleMediaError(this)">';
    var nav = "", dots = "";
    if (images.length > 1) {
      nav =
        '<button class="gallery-nav gallery-prev" data-action="gallery-prev" type="button" title="התמונה הקודמת">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>' +
        '</button>' +
        '<button class="gallery-nav gallery-next" data-action="gallery-next" type="button" title="התמונה הבאה">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>' +
        '</button>';
      dots = '<div class="gallery-dots">' + images.map(function (_, i) {
        return '<span class="gallery-dot' + (i === 0 ? ' is-active' : '') + '" data-action="gallery-dot" data-idx="' + i + '"></span>';
      }).join("") + '</div>';
    }
    return imgTag + '<span class="media-fallback">' + placeholderIcon + '</span>' + nav + dots;
  }

  function searchText(p) {
    var cat = catByPid(p.category);
    var parts = [p.title, cat ? cat.label : "", p.description || "", p.brand || "", p.supplier || ""];
    return parts.join(" ").toLowerCase();
  }

  function productInfoChips(p, supplierLabel) {
    var chips = [];
    if (p.brand) chips.push(["מותג", p.brand]);
    if (p.supplier) chips.push([supplierLabel || "ספק", p.supplier]);
    if (p.warranty) chips.push(["תקופת אחריות", p.warranty]);
    return chips;
  }
  function matchesQuery(p, q) {
    if (!q) return true;
    var words = q.toLowerCase().trim().split(/\s+/).filter(Boolean);
    var hay = searchText(p);
    return words.every(function (w) { return hay.indexOf(w) !== -1; });
  }
  function matchesPriceBand(p, band) {
    if (band === "all" || !band) return true;
    if (band === "u200") return p.price <= 200;
    if (band === "200-500") return p.price > 200 && p.price <= 500;
    if (band === "500p") return p.price > 500;
    return true;
  }

  /* ---------------- card / sheet builders ---------------- */
  function cardHtml(p) {
    var attrs = productInfoChips(p).map(function (a) { return '<span class="chip">' + escapeHtml(a[0]) + ': ' + escapeHtml(a[1]) + '</span>'; }).join("");
    var ribbon = (p.compareAtPrice && p.compareAtPrice > p.price) ? '<span class="discount-badge-corner">-' + discountPct(p) + '%</span>' : "";
    var compare = (p.compareAtPrice && p.compareAtPrice > p.price) ? '<span class="price-compare">' + fmtPrice(p.compareAtPrice) + '</span>' : "";
    var cardImg = productImages(p)[0] || null;
    return '<button class="card" data-sku="' + p.sku + '">' +
      '<span class="card-media" data-has-image="' + (cardImg ? "true" : "false") + '">' + mediaMarkup(cardImg) + ribbon + '</span>' +
      '<span class="card-body">' +
        '<span class="card-title">' + escapeHtml(p.title) + '</span>' +
        '<span class="card-attrs">' + attrs + '</span>' +
        cardColorDotsHtml(p) +
        '<span class="card-footer">' +
          '<span class="price-block">' + compare + '<span class="price">' + fmtPrice(p.price) + '</span></span>' +
          '<span class="avail">✓ זמין</span>' +
        '</span>' +
      '</span>' +
    '</button>';
  }

  // כרטיס קומפקטי-ונפרד לגמרי לרצועת "המבצעים החמים" - לא הכרטיס הרגיל במידות
  // מוקטנות, אלא מבנה-תוכן מצומצם בכוונה (רק תמונה+כותרת+מחיר, בלי צ'יפים/
  // צבעים/תגית-זמינות) כדי שיישאר קריא וקומפקטי גם ברוחב-קטן.
  function featuredCardHtml(p) {
    var ribbon = (p.compareAtPrice && p.compareAtPrice > p.price) ? '<span class="discount-badge-corner">-' + discountPct(p) + '%</span>' : "";
    var cardImg = productImages(p)[0] || null;
    return '<button class="card featured-card" data-sku="' + p.sku + '">' +
      '<span class="card-media" data-has-image="' + (cardImg ? "true" : "false") + '">' + mediaMarkup(cardImg) + ribbon + '</span>' +
      '<span class="card-body">' +
        '<span class="card-title">' + escapeHtml(p.title) + '</span>' +
        '<span class="card-footer"><span class="price">' + fmtPrice(p.price) + '</span></span>' +
      '</span>' +
    '</button>';
  }

  function wireCards(container) {
    Array.prototype.forEach.call(container.querySelectorAll(".card"), function (btn) {
      btn.addEventListener("click", function () { openProduct(btn.getAttribute("data-sku")); });
    });
  }

  /* ---------------- state / nav ---------------- */
  var state = { screen: "home", category: null, subCategory: null, catQuery: "", catSort: "featured", catBand: "all", homeQuery: "" };
  var screenHome = document.getElementById("screen-home");
  var screenSub = document.getElementById("screen-subcategory");
  var screenCat = document.getElementById("screen-category");
  var overlay = document.getElementById("overlay");
  var homeFab = document.getElementById("homeFab");

  function switchScreen(name) {
    screenHome.classList.toggle("is-active", name === "home");
    screenSub.classList.toggle("is-active", name === "subcategory");
    screenCat.classList.toggle("is-active", name === "category");
    homeFab.classList.toggle("is-hidden", name === "home");
  }

  /* ---------------- HOME ---------------- */
  function renderFeatured() {
    var wrap = document.getElementById("featuredWrap");
    var items = getProducts().filter(function (p) { return p.featured && inStock(p); });
    if (!items.length) { wrap.classList.add("is-empty"); return; }
    wrap.classList.remove("is-empty");
    var scroll = document.getElementById("featuredScroll");
    scroll.innerHTML = items.map(featuredCardHtml).join("");
    wireCards(scroll);
  }

  function renderTiles() {
    var wrap = document.getElementById("tiles");
    wrap.innerHTML = getCategories().map(function (c) {
      var count = getProducts().filter(function (p) { return p.category === c.id && inStock(p); }).length;
      var countLabel = count === 1 ? '1 פריט זמין' : count + ' פריטים זמינים';
      var photo = '<span class="tile-photo" data-has-image="' + (c.image ? "true" : "false") + '">' +
        (c.image ? '<img src="' + escapeAttr(c.image) + '" alt="" onerror="handleMediaError(this)">' : '') +
        '<span class="tile-icon-fallback">' + c.icon() + '</span>' +
      '</span>';
      return '<button class="tile" data-cat="' + c.id + '">' +
        photo +
        '<span class="tile-name">' + c.label + '</span>' +
        '<span class="tile-count">' + countLabel + '</span>' +
      '</button>';
    }).join("");
    Array.prototype.forEach.call(wrap.querySelectorAll(".tile"), function (btn) {
      btn.addEventListener("click", function () { openCategoryTop(btn.getAttribute("data-cat")); });
    });
  }

  function renderHomeSearch() {
    var box = document.getElementById("homeSearchBox");
    var results = document.getElementById("home-results");
    var q = state.homeQuery;
    box.classList.toggle("has-text", !!q);
    if (!q) {
      results.classList.remove("is-active");
      document.getElementById("featuredWrap").style.display = "";
      document.getElementById("tiles").style.display = "";
      return;
    }
    document.getElementById("featuredWrap").style.display = "none";
    document.getElementById("tiles").style.display = "none";
    var matches = getProducts().filter(function (p) { return inStock(p) && matchesQuery(p, q); });
    var html = '<div class="result-label">' + (matches.length ? matches.length + ' תוצאות עבור "' + escapeHtml(q) + '"' : '') + '</div>';
    if (!matches.length) {
      html += '<div class="empty-state">לא נמצאו מוצרים תואמים</div>';
    } else {
      html += '<div class="product-grid" style="padding:0">' + matches.map(cardHtml).join("") + '</div>';
    }
    results.innerHTML = html;
    wireCards(results);
    results.classList.add("is-active");
  }

  /* ---------------- CATEGORY ---------------- */
  function openCategoryTop(catId) {
    var cat = catByPid(catId);
    if (!cat) return;
    if (cat.subCategories && cat.subCategories.length) {
      openSubcategoryScreen(catId);
    } else {
      openProductGrid(catId, null);
    }
  }

  function openSubcategoryScreen(catId) {
    var cat = catByPid(catId);
    if (!cat || !cat.subCategories) return;
    state.screen = "subcategory"; state.category = catId; state.subCategory = null;
    document.getElementById("subcat-title").innerHTML = '<span class="tile-icon">' + cat.icon() + '</span>' + cat.label;
    var wrap = document.getElementById("subcatTiles");
    wrap.innerHTML = cat.subCategories.map(function (sc) {
      var count = getProducts().filter(function (p) { return p.category === catId && p.subCategory === sc.id && inStock(p); }).length;
      var countLabel = count === 1 ? '1 פריט זמין' : count + ' פריטים זמינים';
      return '<button class="subcat-tile" data-subcat="' + sc.id + '">' +
        '<span class="subcat-tile-name">' + sc.label + '</span>' +
        '<span class="subcat-tile-count">' + countLabel + '</span>' +
      '</button>';
    }).join("");
    Array.prototype.forEach.call(wrap.querySelectorAll(".subcat-tile"), function (btn) {
      btn.addEventListener("click", function () { openProductGrid(catId, btn.getAttribute("data-subcat")); });
    });
    screenSub.scrollTop = 0;
    switchScreen("subcategory");
  }

  function openProductGrid(catId, subCatId) {
    var cat = catByPid(catId);
    if (!cat) return;
    state.screen = "category"; state.category = catId; state.subCategory = subCatId || null;
    state.catQuery = ""; state.catSort = "featured"; state.catBand = "all";
    document.getElementById("catSearchInput").value = "";
    var subLabel = "";
    if (subCatId && cat.subCategories) {
      var sc = cat.subCategories.filter(function (s) { return s.id === subCatId; })[0];
      subLabel = sc ? sc.label : "";
    }
    document.getElementById("cat-title").innerHTML = '<span class="tile-icon">' + cat.icon() + '</span>' + (subLabel || cat.label);
    var backBtn = document.getElementById("catCrumbBack");
    var sep = document.getElementById("catCrumbSep");
    if (subCatId && cat.subCategories && cat.subCategories.length) {
      backBtn.hidden = false; sep.hidden = false;
      backBtn.textContent = cat.label;
      backBtn.onclick = function () { openSubcategoryScreen(catId); };
    } else {
      backBtn.hidden = true; sep.hidden = true;
      backBtn.onclick = null;
    }
    renderCategoryGrid();
    screenCat.scrollTop = 0;
    switchScreen("category");
  }

  function renderCategoryGrid() {
    document.getElementById("catSearchBox").classList.toggle("has-text", !!state.catQuery);
    var items = getProducts().filter(function (p) {
      if (p.category !== state.category) return false;
      if (state.subCategory && p.subCategory !== state.subCategory) return false;
      return inStock(p) && matchesQuery(p, state.catQuery) && matchesPriceBand(p, state.catBand);
    });
    items.sort(function (a, b) {
      if (state.catSort === "price-asc") return a.price - b.price;
      if (state.catSort === "price-desc") return b.price - a.price;
      return (b.featured ? 1 : 0) - (a.featured ? 1 : 0);
    });
    var grid = document.getElementById("product-grid");
    grid.innerHTML = items.length ? items.map(cardHtml).join("") : '<div class="empty-state">אין פריטים תואמים לסינון הנוכחי</div>';
    wireCards(grid);
  }

  /* ---------------- PRODUCT OVERLAY ---------------- */
  var galleryImages = [];
  var galleryIndex = 0;
  var activeColors = [];
  var activeColorIndex = 0;
  function updateGalleryImage() {
    var img = document.querySelector(".sheet-media [data-gallery-img]");
    if (img) img.src = galleryImages[galleryIndex];
    Array.prototype.forEach.call(document.querySelectorAll(".gallery-dot"), function (d, i) {
      d.classList.toggle("is-active", i === galleryIndex);
    });
  }
  function galleryPrev() { galleryIndex = (galleryIndex - 1 + galleryImages.length) % galleryImages.length; updateGalleryImage(); }
  function galleryNext() { galleryIndex = (galleryIndex + 1) % galleryImages.length; updateGalleryImage(); }

  function wireGalleryButtons(sheetEl) {
    var prevBtn = sheetEl.querySelector('[data-action="gallery-prev"]');
    var nextBtn = sheetEl.querySelector('[data-action="gallery-next"]');
    if (prevBtn) prevBtn.addEventListener("click", galleryPrev);
    if (nextBtn) nextBtn.addEventListener("click", galleryNext);
    Array.prototype.forEach.call(sheetEl.querySelectorAll('[data-action="gallery-dot"]'), function (dot) {
      dot.addEventListener("click", function () { galleryIndex = parseInt(dot.getAttribute("data-idx"), 10); updateGalleryImage(); });
    });
  }

  function colorSwatchesHtml(colors, activeIdx) {
    var swatches = colors.map(function (c, i) {
      return '<span class="sheet-color-swatch' + (i === activeIdx ? ' is-active' : '') + '" data-action="pick-color" data-idx="' + i +
        '" style="background:' + escapeAttr(c.swatch || "#cccccc") + '" title="' + escapeAttr(c.name || "") + '"></span>';
    }).join("");
    var activeName = escapeHtml((colors[activeIdx] && colors[activeIdx].name) || "");
    return '<div class="sheet-color-section">' +
      '<div class="sheet-color-label">בחרו צבע' + (activeName ? ' — נבחר: <b>' + activeName + '</b>' : '') + '</div>' +
      '<div class="sheet-color-swatches">' + swatches + '</div>' +
    '</div>';
  }

  function switchColor(idx) {
    if (!activeColors[idx]) return;
    activeColorIndex = idx;
    galleryImages = activeColors[idx].images || [];
    galleryIndex = 0;
    var mediaEl = document.querySelector(".sheet-media");
    if (mediaEl) {
      mediaEl.setAttribute("data-has-image", galleryImages.length ? "true" : "false");
      mediaEl.classList.remove("img-failed");
      mediaEl.innerHTML = galleryHtml(galleryImages);
      wireGalleryButtons(document.getElementById("sheet"));
    }
    var labelEl = document.querySelector(".sheet-color-label");
    if (labelEl) labelEl.innerHTML = "בחרו צבע — נבחר: <b>" + escapeHtml(activeColors[idx].name || "") + "</b>";
    Array.prototype.forEach.call(document.querySelectorAll(".sheet-color-swatch"), function (sw, i) {
      sw.classList.toggle("is-active", i === idx);
    });
  }

  function openProduct(sku) {
    var p = getProducts().filter(function (x) { return x.sku === sku; })[0];
    if (!p) return;
    var cat = catByPid(p.category);
    var hasDiscount = p.compareAtPrice && p.compareAtPrice > p.price;
    var infoChips = productInfoChips(p, "יבואן").map(function (a) { return '<span class="chip">' + escapeHtml(a[0]) + ': ' + escapeHtml(a[1]) + '</span>'; }).join("");
    activeColors = productColors(p);
    activeColorIndex = 0;
    galleryImages = activeColors.length ? (activeColors[0].images || []) : productImages(p);
    galleryIndex = 0;
    document.getElementById("sheet").innerHTML =
      '<div class="sheet-close-bar"><button class="sheet-close" data-action="close-sheet">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>' +
      '</button></div>' +
      '<div class="sheet-top">' +
        '<div class="sheet-info">' +
          '<span class="sheet-cat-chip">' + (cat ? cat.label : "") + '</span>' +
          '<h3 class="sheet-title">' + escapeHtml(p.title) + '</h3>' +
          (p.modelCode ? '<div class="sheet-model-code">קוד דגם: ' + escapeHtml(p.modelCode) + '</div>' : '') +
          (infoChips ? '<div class="sheet-info-chips">' + infoChips + '</div>' : '') +
          (activeColors.length ? colorSwatchesHtml(activeColors, activeColorIndex) : '') +
          '<div class="sheet-price-row">' +
            '<span class="sheet-price-stack">' +
              (hasDiscount ? '<span class="sheet-price-compare">' + fmtPrice(p.compareAtPrice) + '</span>' : '') +
              '<span class="sheet-price">' + fmtPrice(p.price) + '</span>' +
              (hasDiscount ? '<span class="sheet-discount-badge">' + discountPct(p) + '% הנחה</span>' : '') +
            '</span>' +
            '<span class="avail">✓ זמין במלאי</span>' +
          '</div>' +
        '</div>' +
        '<span class="sheet-media" data-has-image="' + (galleryImages.length ? "true" : "false") + '">' + galleryHtml(galleryImages) + '</span>' +
      '</div>' +
      (p.details ? '<div class="sheet-details">' + p.details + '</div>' : '');
    var sheetEl = document.getElementById("sheet");
    sheetEl.querySelector('[data-action="close-sheet"]').addEventListener("click", closeProduct);
    wireGalleryButtons(sheetEl);
    Array.prototype.forEach.call(sheetEl.querySelectorAll('[data-action="pick-color"]'), function (sw) {
      sw.addEventListener("click", function () { switchColor(parseInt(sw.getAttribute("data-idx"), 10)); });
    });
    overlay.classList.add("is-active");
  }
  function closeProduct() { overlay.classList.remove("is-active"); }

  function goHome() {
    closeProduct();
    state.screen = "home"; state.category = null; state.subCategory = null;
    state.homeQuery = ""; document.getElementById("homeSearchInput").value = "";
    renderHomeSearch();
    switchScreen("home");
  }

  /* ---------------- wiring ---------------- */
  Array.prototype.forEach.call(document.querySelectorAll('[data-action="go-home"]'), function (btn) {
    btn.addEventListener("click", goHome);
  });
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeProduct(); });
  homeFab.addEventListener("click", goHome);

  var homeInput = document.getElementById("homeSearchInput");
  homeInput.addEventListener("input", function () { state.homeQuery = homeInput.value; renderHomeSearch(); });
  document.getElementById("homeSearchClear").addEventListener("click", function () { homeInput.value = ""; state.homeQuery = ""; renderHomeSearch(); homeInput.focus(); });

  var catInput = document.getElementById("catSearchInput");
  catInput.addEventListener("input", function () { state.catQuery = catInput.value; renderCategoryGrid(); });
  document.getElementById("catSearchClear").addEventListener("click", function () { catInput.value = ""; state.catQuery = ""; renderCategoryGrid(); catInput.focus(); });

  renderFeatured();
  renderTiles();
})();
</script>

</body></html>
